services:
  - type: web
    name: mensa-assembleia-demo
    runtime: docker
    plan: free
    region: oregon
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /health/ready
    envVars:
      - key: DJANGO_DEBUG
        value: "false"
      - key: MENSA_DEMO_MODE
        value: "true"
      - key: MENSA_DEMO_ACCESS_PASSWORD
        sync: false
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: mensa-assembleia-demo-db
          property: connectionString
databases:
  - name: mensa-assembleia-demo-db
    plan: free
    region: oregon
    databaseName: mensa_demo
    user: mensa_demo
    ipAllowList: []
