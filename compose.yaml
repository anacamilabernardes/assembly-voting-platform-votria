# Local development stack: PostgreSQL plus the same image that Render runs (interface + API).
name: votria-dev
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: votria
      POSTGRES_USER: votria
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U votria -d votria"]
      interval: 5s
      timeout: 3s
      retries: 10
  app:
    build: .
    environment:
      PORT: "8000"
      DJANGO_DEBUG: "true"
      VOTRIA_DEMO_MODE: "true"
      VOTRIA_DEMO_ACCESS_PASSWORD: ${VOTRIA_DEMO_ACCESS_PASSWORD:?Set VOTRIA_DEMO_ACCESS_PASSWORD (16+ characters)}
      VOTRIA_INSTITUTION_NAME: ${VOTRIA_INSTITUTION_NAME:-}
      VOTRIA_ALLOWED_EMAIL_DOMAIN: ${VOTRIA_ALLOWED_EMAIL_DOMAIN:-}
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:?Set DJANGO_SECRET_KEY}
      DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1
      DJANGO_CSRF_TRUSTED_ORIGINS: http://localhost:8000,http://127.0.0.1:8000
      POSTGRES_HOST: postgres
      POSTGRES_DB: votria
      POSTGRES_USER: votria
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
volumes:
  postgres_data:
